name: Release AAB store qualification (upload-signed, fails closed)

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Blocked: this lane always produces a signed store AAB, and artifacts are visible to any logged-in GitHub user on this public repo. Kept for explicit refusal only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metly-release-aab-qualification
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install Android SDK 36 platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Write upload keystore (required: store qualification fails closed)
        env:
          METLY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.METLY_UPLOAD_KEYSTORE_BASE64 }}
          METLY_UPLOAD_STORE_PASSWORD: ${{ secrets.METLY_UPLOAD_STORE_PASSWORD }}
          METLY_UPLOAD_KEY_ALIAS: ${{ secrets.METLY_UPLOAD_KEY_ALIAS }}
          METLY_UPLOAD_KEY_PASSWORD: ${{ secrets.METLY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$METLY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Upload keystore secrets are missing. This lane is store qualification and must produce a build signed with the pinned upload certificate; refusing to pass unsigned/debug-signed output."
            exit 1
          fi
          echo "$METLY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/metly-upload.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/metly-upload.keystore"
            echo "storePassword=$METLY_UPLOAD_STORE_PASSWORD"
            echo "keyAlias=$METLY_UPLOAD_KEY_ALIAS"
            echo "keyPassword=$METLY_UPLOAD_KEY_PASSWORD"
          } > android/key.properties
          echo "Upload keystore written for signed build."
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Determine version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid pubspec version: $VERSION"; exit 1; }
          BUILD_NUMBER=$((200000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ steps.meta.outputs.build_number }}"
      - name: Structural sanity check
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          unzip -l "$AAB" | grep -q 'base/dex/'
          unzip -l "$AAB" | grep -q 'BundleConfig.pb'
          echo "AAB structure OK"
      - name: Verify signing identity (fail closed on missing or mismatched upload cert)
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          # AABs are JAR-signed: verify the signature with jarsigner.
          if ! jarsigner -verify "$AAB" > /tmp/jarsigner-out.txt 2>&1; then
            cat /tmp/jarsigner-out.txt
            echo "::error::AAB JAR signature verification failed."
            exit 1
          fi
          # jarsigner does not print SHA-256 fingerprints; read the signer
          # certificate with keytool instead and assert the pinned upload
          # certificate (recovered with keytool from the actual keystore,
          # 2026-11-19, alias metly-upload).
          EXPECTED="54:B9:B0:B3:C5:1D:1D:BD:27:0C:35:DF:32:2B:0E:80:76:91:6B:25:EE:CA:36:62:AA:56:19:BE:8B:CB:35:54"
          if ! keytool -printcert -jarfile "$AAB" > /tmp/signer-certs.txt 2>&1; then
            cat /tmp/signer-certs.txt
            echo "::error::Could not read the signer certificate from the AAB."
            exit 1
          fi
          if ! grep -Fq "$EXPECTED" /tmp/signer-certs.txt; then
            echo "::error::Signer certificate does not match the pinned upload certificate SHA-256."
            grep -E 'SHA-256' /tmp/signer-certs.txt | head -5
            exit 1
          fi
          echo "Signed with pinned upload certificate SHA-256: $EXPECTED"
      - name: Guard: never upload signed AAB as a public artifact
        env:
          METLY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.METLY_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.upload_artifact }}" = "true" ] && [ -n "$METLY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Refusing to upload a signed AAB as a public artifact."
            exit 1
          fi
      - name: Hash and upload artifact
        if: inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: metly-release-aab-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: SHA256
        run: sha256sum build/app/outputs/bundle/release/app-release.aab
