name: Metly Android artifact qualification

# Manual qualification only. No main/PR push starts an Android build, and this
# workflow cannot create tags or releases. On this public repo, artifacts are
# downloadable by signed-in GitHub users. No secrets/private inputs are supplied.
# These are CI qualification outputs,
# not installable release delivery or device/upgrade qualification.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metly-android-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install Android SDK 36 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::Android sdkmanager is not available on PATH"
            exit 1
          fi
          (yes || true) | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Determine version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid pubspec version: $VERSION"; exit 1; }
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Build installable Android APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ steps.meta.outputs.build_number }}"
      - name: Prepare qualification assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/Metly-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}.apk"
          printf '%s\n' \
            'Metly Android qualification artifact. Not a release.' \
            "Source: ${GITHUB_SHA}" \
            "Ref: ${GITHUB_REF}" \
            "Run: ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}" \
            'Uses an ephemeral runner debug certificate, not a persistent release identity.' \
            'Do not install over an existing app. Upgrade, device and account flows are not qualified.' \
            'No signing key is generated for release custody or uploaded in this artifact.' \
            > release-assets/QUALIFICATION.txt
          flutter --version >> release-assets/QUALIFICATION.txt
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt
      - name: Verify APK signature and record certificate
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK_ROOT" ] || { echo "::error::Android SDK root is not configured"; exit 1; }
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            release-assets/*.apk > release-assets/SIGNING-CERTIFICATE.txt
          cat release-assets/SIGNING-CERTIFICATE.txt
      # Pinned actions/upload-artifact v4. No release or tag mutation.
      - name: Upload quarantined qualification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metly-android-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
