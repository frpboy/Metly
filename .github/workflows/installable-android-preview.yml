name: Metly Android installable preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/installable-android-preview.yml
      - android/**
      - lib/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a public GitHub prerelease of this build. Default false: build, analyze and test only, nothing published.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: metly-android-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install Android SDK 36 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMGR" ] || { echo "::error::Android sdkmanager is not available"; exit 1; }
          (yes || true) | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Determine version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid pubspec version: $VERSION"; exit 1; }
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=preview-v${VERSION}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build installable Android APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.version }}" \
            --build-number="${{ steps.meta.outputs.build_number }}"
      - name: Reject unreviewed build-time source migrations
        shell: bash
        run: |
          set -euo pipefail
          # Flutter can rewrite Android compatibility settings during apk build.
          # Do not retain an artifact built after an unreviewed source change.
          git diff --exit-code
          git diff --cached --exit-code
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/Metly-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK_ROOT" ] || { echo "::error::Android SDK root is not configured"; exit 1; }
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            ./*.apk > SIGNING-CERTIFICATE.txt
          cat SIGNING-CERTIFICATE.txt
          printf '%s\n' \
            'Metly Android installable preview. Not a Play Store release.' \
            "Source: ${GITHUB_SHA}" \
            "Ref: ${GITHUB_REF}" \
            "Run: ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}" \
            'Signed with an ephemeral runner debug certificate, not the release upload identity.' \
            'Do not install over an existing app. Upgrade, device and account flows are not qualified.' \
            > QUALIFICATION.txt
          flutter --version >> QUALIFICATION.txt
      - name: Publish installable preview
        # Publication is deliberate only: an explicit workflow_dispatch with
        # publish=true. Pushes to main build, analyze and test but never publish,
        # so an unqualified or stale artifact can never reach public releases.
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Metly v${{ steps.meta.outputs.version }} — Installable Android preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Installable Android preview built from the repository's main branch.

            Signing: uses the Android debug signing identity for this preview. A later preview signed by a different runner key may require uninstalling the earlier preview first. Not a Play Store release.
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
            release-assets/SIGNING-CERTIFICATE.txt
            release-assets/QUALIFICATION.txt
          fail_on_unmatched_files: true
